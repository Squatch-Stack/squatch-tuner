# SPDX-License-Identifier: MIT
# A release: pushing a signed tag v* builds, scans, checksums and attests the assets, and creates a DRAFT
# GitHub release for the maintainer to publish. Nothing is published by this workflow.
#
#   source + web demo + Linux CLI (x86-64, arm64)  ->  macOS CLI  ->  sign (skipped until the Developer ID
#   secrets exist)  ->  SHA256SUMS + build-provenance attestation + draft release
#
# The macOS CLI is ad-hoc signed until the secrets named in tools/release-signing are set in the
# Environment `release`; then the `sign` job signs it with Developer ID (hardened runtime), notarizes and
# verifies it. The attestation covers the final signed and notarized zip.
# With none of them set that job skips signing, says so in its log and in the release notes. The Linux
# binaries are not Apple-signed; they are covered by the checksums and the attestation.
# Actions are pinned to full commit SHAs.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ github.ref_name }}
jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - name: The tag is a signed tag that GitHub shows as Verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          [ "$(jq -r .object.type <<<"$ref")" = tag ] || { echo "::error::$TAG is a lightweight tag: create it with git tag -s"; exit 1; }
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")")
          [ "$(jq -r .verification.verified <<<"$tag")" = true ] || {
            echo "::error::$TAG is not verified: $(jq -r .verification.reason <<<"$tag")"; exit 1; }

  source:
    needs: verify-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exported files match EXPORTED
        run: make verify-export
      - name: gitleaks 8.30.1 (pinned release, checksum checked)
        run: |
          set -euo pipefail
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gl" && tar -xzf gl.tgz -C "$RUNNER_TEMP/gl" gitleaks && rm gl.tgz
          "$RUNNER_TEMP/gl/gitleaks" dir . --no-banner --redact
      - name: The release scanner passes its own tests, then the tree is scanned
        run: |
          python3 tools/test-release-scan
          python3 tools/test-release-signing
          python3 tools/release-scan .
      - name: Unit tests (ASan + UBSan) and host tests (TSan)
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          make test CXX=clang++
      - name: The published tuner.wasm reads the test tones
        run: node hosts/wasm/test/core.test.mjs docs/tuner.wasm
      - name: Source archive and web demo
        run: |
          set -euo pipefail
          python3 tools/release-scan docs
          mkdir dist
          git archive --format=tar.gz --prefix="squatch-tuner-${TAG#v}/" -o "dist/squatch-tuner-$TAG-source.tar.gz" "$GITHUB_SHA"
          (cd docs && zip -X -q -r -9 "../dist/squatch-tuner-web-$TAG.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: dist/*
          if-no-files-found: error

  cli-linux:
    needs: verify-tag
    strategy:
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JACK headers (Ubuntu packages)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libjack-jackd2-dev
      - name: Build squatch-tuner-live and squatch-tone, build paths mapped out
        run: |
          set -euo pipefail
          make live CXX=g++ CXXFLAGS="-std=c++17 -O3 -Wall -Wextra -Wpedantic -Wshadow -Iinclude -ffile-prefix-map=$PWD=."
          python3 tools/release-scan build/squatch-tuner-live build/squatch-tone
          file build/squatch-tuner-live
          ./build/squatch-tuner-live --help 2>&1 | head -3 || true
          d="squatch-tuner-live-$TAG-linux-${{ matrix.arch }}"
          mkdir -p "dist/$d"
          cp build/squatch-tuner-live build/squatch-tone LICENSE "dist/$d/"
          tar -C dist -czf "dist/$d.tar.gz" "$d"
          rm -r "dist/$d"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  cli-macos:
    needs: verify-tag
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build for Apple silicon on CoreAudio, build paths mapped out (ad-hoc signed by the linker)
        run: |
          set -euo pipefail
          make live CXX=clang++ CXXFLAGS="-std=c++17 -O3 -Wall -Wextra -Wpedantic -Wshadow -Iinclude -ffile-prefix-map=$PWD=."
          # The macOS CLI needs nothing installed: only system libraries may be linked.
          for b in build/squatch-tuner-live build/squatch-tone; do
            otool -L "$b"
            bad=$(otool -L "$b" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/System/|/usr/lib/)' || true)
            if [ -n "$bad" ]; then echo "::error::$b links a library that is not part of macOS: $bad"; exit 1; fi
          done
          python3 tools/release-scan build/squatch-tuner-live build/squatch-tone
          lipo -archs build/squatch-tuner-live
          codesign --verify --strict build/squatch-tuner-live
          mkdir -p stage
          cp build/squatch-tuner-live build/squatch-tone LICENSE stage/
          mkdir dist && ditto -c -k stage dist/cli-macos-unsigned.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-macos-unsigned
          path: dist/cli-macos-unsigned.zip
          if-no-files-found: error

  # Signs, notarizes and verifies in the Environment `release`: it has a required reviewer (every run waits
  # for the maintainer's approval) and only tag refs may use it. The certificate and the notarization key
  # are that environment's secrets (tools/release-signing says which); with none of them set the ad-hoc
  # build passes through, labelled as such. A temporary keychain holds the certificate and is deleted.
  sign:
    needs: cli-macos
    runs-on: macos-15
    environment: release
    outputs:
      signing: ${{ steps.check.outputs.signing }}
    env:
      MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-macos-unsigned
      - name: Are the signing secrets set? (skips cleanly when none are)
        id: check
        run: |
          rc=0; tools/release-signing check --github-output "$GITHUB_OUTPUT" || rc=$?
          case $rc in 0) ;; 10) echo "::notice title=Signing skipped::No signing secrets: the macOS CLI is ad-hoc signed only. Set them in the Environment 'release'.";; *) exit "$rc";; esac
      - name: Temporary keychain with the Developer ID Application certificate
        if: steps.check.outputs.signing == 'yes'
        run: tools/release-signing keychain
      - name: Sign (hardened runtime, secure timestamp), notarize, verify
        if: steps.check.outputs.signing == 'yes'
        run: |
          set -euo pipefail
          mkdir stage && ditto -x -k cli-macos-unsigned.zip stage
          # The hardened runtime needs the audio-input entitlement for the tuner to hear a microphone.
          tools/release-signing sign --entitlements .github/release/cli.entitlements stage/squatch-tuner-live stage/squatch-tone
          mkdir out
          ditto -c -k stage "out/squatch-tuner-live-$TAG-macos-arm64.zip"
          # A bare executable cannot carry a stapled ticket: Gatekeeper finds it online at first launch.
          tools/release-signing notarize "out/squatch-tuner-live-$TAG-macos-arm64.zip"
          tools/release-signing verify stage/squatch-tuner-live stage/squatch-tone
      - name: Ad-hoc build passes through, named for what it is
        if: steps.check.outputs.signing != 'yes'
        run: |
          mkdir out
          cp cli-macos-unsigned.zip "out/squatch-tuner-live-$TAG-macos-arm64-adhoc-unsigned.zip"
      - name: Delete the temporary keychain and key files
        if: always()
        run: tools/release-signing cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-macos
          path: out/*
          if-no-files-found: error

  release:
    needs: [source, cli-linux, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # the draft release
      id-token: write       # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: '{source,cli-linux-*,cli-macos}'
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING: ${{ needs.sign.outputs.signing }}
        run: |
          set -euo pipefail
          if [ "$SIGNING" = yes ]; then
            status="The macOS CLI is signed with Developer ID and notarized."
          else
            status="**The macOS CLI is ad-hoc signed and not notarized** (Developer ID certificates are not installed yet), so macOS will warn on first launch. This release is a draft until that is done."
          fi
          cat > notes.md <<NOTES
          Squatch Tuner $TAG.

          - \`squatch-tuner-$TAG-source.tar.gz\`: the source.
          - \`squatch-tuner-web-$TAG.zip\`: the browser demo, the same files as the published demo page.
          - \`squatch-tuner-live-$TAG-linux-x86_64.tar.gz\`, \`-linux-arm64.tar.gz\`, \`squatch-tuner-live-$TAG-macos-arm64*.zip\`: the headless tuner, with \`squatch-tone\`, an exact test tone. On Linux they need a running JACK server; the macOS build uses CoreAudio and needs nothing installed.

          $status

          Verify what you downloaded:

          \`\`\`sh
          shasum -a 256 -c SHA256SUMS            # sha256sum -c on Linux
          gh attestation verify FILE -R $GITHUB_REPOSITORY
          \`\`\`

          The tag $TAG is SSH-signed and shows Verified on GitHub. The attestation names this repository's release workflow and the tagged commit.
          NOTES
          flags=(--draft --verify-tag --title "Squatch Tuner $TAG" --notes-file notes.md)
          case "$TAG" in *-*) flags+=(--prerelease);; esac
          # This job has no checkout, so name the repository: gh cannot infer it from a git remote here.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
